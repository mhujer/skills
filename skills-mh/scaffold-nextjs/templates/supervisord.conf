[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001

[inet_http_server]
port=0.0.0.0:9001

[program:next-dev]
command=bash -c "exec npx next dev"
directory=/{{PROJECT_NAME}}
stdout_logfile=/tmp/next-dev.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/tmp/next-dev.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true

# A second dev server on a disposable copy of the database, for agent-driven browser checks.
# The prepare script sees both URLs so it can refuse to touch the live database; `next dev` gets
# AGENT_DATABASE_URL as its DATABASE_URL, so the app code needs no agent branch. The swap happens
# in bash rather than in `environment=` because supervisord refuses to boot at all when a
# `%(ENV_...)s` variable is unset, which would take next-dev down with it.
[program:agent-dev]
command=bash -c "npx tsx scripts/prepare-agent-database.ts && DATABASE_URL=\"$AGENT_DATABASE_URL\" DATABASE_URL_UNPOOLED=\"$AGENT_DATABASE_URL\" exec npx next dev --port 3001"
directory=/{{PROJECT_NAME}}
environment=NEXT_DIST_DIR=".next-agent",CLIENT_ERROR_LOG_PATH="/tmp/agent-client-errors.log"
stdout_logfile=/tmp/agent-next-dev.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/tmp/agent-next-dev.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true

# supervisord captures each program into its own file under /tmp so the web UI and
# `supervisorctl tail` can read them; this mirrors those files to the container's
# stdout so `docker compose logs -f app` keeps working.
[program:log-mirror]
command=bash -c "exec tail -n 0 -F -q /tmp/next-dev.log /tmp/next-dev.err.log /tmp/agent-next-dev.log /tmp/agent-next-dev.err.log"
directory=/{{PROJECT_NAME}}
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
